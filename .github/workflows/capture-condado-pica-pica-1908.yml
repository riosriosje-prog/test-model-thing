name: capture-condado-pica-pica-1908

on:
  push:
    branches:
      - galia-historical-store-v0-1
    paths:
      - .github/workflows/capture-condado-pica-pica-1908.yml
      - pilots/condado_shadow.py
      - tools/run_condado_pica_pica_capture_pilot.py
      - historical_store.py
      - historical_artifacts.py
      - historical_store_bundle.py
      - tests/test_condado_shadow.py

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_URL: https://ufdcimages.uflib.ufl.edu/AA/00/09/81/80/00265/1908050901.pdf

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Capture UFDC Pica-Pica PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capture
          curl             --fail --location --silent --show-error             --retry 3 --retry-delay 2             --connect-timeout 20 --max-time 180             --user-agent "Mozilla/5.0 GALIA-Historical-Research/0.1"             --output capture/pica_pica_1908_05_09.pdf             "$SOURCE_URL"

          python - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path("capture/pica_pica_1908_05_09.pdf")
          data = p.read_bytes()
          assert data.startswith(b"%PDF-"), "Downloaded bytes are not a PDF"
          assert len(data) > 1000, "Downloaded PDF is unexpectedly small"
          print("PICA_PICA_RAW_SHA256=" + hashlib.sha256(data).hexdigest())
          print("PICA_PICA_RAW_SIZE=" + str(len(data)))
          PY

      - name: Run end-to-end Historical Store raw capture pilot
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/run_condado_pica_pica_capture_pilot.py             --source-file capture/pica_pica_1908_05_09.pdf             --output-dir capture/pilot

          python - <<'PY'
          import json, pathlib
          receipt = json.loads(
              pathlib.Path("capture/pilot/CAPTURE_PILOT_RECEIPT.json").read_text()
          )
          assert receipt["status"] == "RAW_PRIMARY_SOURCE_CAPTURE_PASS"
          assert receipt["authority"]["raw_capture_verified"] is True
          assert receipt["authority"]["objective_promotion_gate_satisfied"] is True
          assert receipt["authority"]["human_canonical_review_executed"] is False
          assert receipt["authority"]["canonical_promotion_executed"] is False
          assert (
              receipt["historical_store"]["claim_status_after_capture"]
              == "PROPOSED"
          )
          assert receipt["historical_store"]["promotion_blockers_after_capture"] == []
          print("CONDADO_PICA_PICA_RAW_CAPTURE_PILOT=PASS")
          PY

      - name: Build deterministic evidence subject
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib, zipfile

          files = [
              pathlib.Path("capture/pica_pica_1908_05_09.pdf"),
              pathlib.Path("capture/pilot/CAPTURE_PILOT_RECEIPT.json"),
              pathlib.Path("capture/pilot/condado_pica_pica_shadow.bundle.json"),
              pathlib.Path("capture/pilot/condado_pica_pica_shadow.sqlite3"),
          ]
          manifest = []
          for path in files:
              data = path.read_bytes()
              manifest.append(
                  f"{hashlib.sha256(data).hexdigest()}  {path.name}\n"
              )
          manifest_path = pathlib.Path("capture/EVIDENCE_MANIFEST_SHA256.txt")
          manifest_path.write_text("".join(manifest), encoding="utf-8")
          files.append(manifest_path)

          out = pathlib.Path(
              "capture/GALIA_CONDADO_PICA_PICA_1908_EVIDENCE.zip"
          )
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for path in files:
                  info = zipfile.ZipInfo(path.name)
                  info.date_time = (1980, 1, 1, 0, 0, 0)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  z.writestr(info, path.read_bytes())
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
          print(
              "EVIDENCE_SUBJECT_SHA256="
              + hashlib.sha256(out.read_bytes()).hexdigest()
          )
          PY

      - name: Generate GitHub artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: capture/GALIA_CONDADO_PICA_PICA_1908_EVIDENCE.zip

      - name: Verify GitHub artifact attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh attestation verify               capture/GALIA_CONDADO_PICA_PICA_1908_EVIDENCE.zip               -R riosriosje-prog/test-model-thing               --format json               > capture/GITHUB_ATTESTATION_VERIFICATION.json; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          test -s capture/GITHUB_ATTESTATION_VERIFICATION.json
          echo "GITHUB_PRIMARY_SOURCE_ATTESTATION_VERIFY=PASS"

      - name: Upload raw source and attested provenance bundle
        uses: actions/upload-artifact@v4
        with:
          name: GALIA_CONDADO_PICA_PICA_1908_RAW_CAPTURE
          path: |
            capture/pica_pica_1908_05_09.pdf
            capture/EVIDENCE_MANIFEST_SHA256.txt
            capture/GALIA_CONDADO_PICA_PICA_1908_EVIDENCE.zip
            capture/GITHUB_ATTESTATION_VERIFICATION.json
            capture/pilot/CAPTURE_PILOT_RECEIPT.json
            capture/pilot/condado_pica_pica_shadow.bundle.json
            capture/pilot/condado_pica_pica_shadow.sqlite3
            capture/pilot/artifact_store/
          if-no-files-found: error
          retention-days: 90
