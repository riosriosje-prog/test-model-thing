name: GALIA Gradio Lite dashboard publisher

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "governance/galia_dashboard_authority_pointer.v1.json"
      - "governance/galia_dashboard_research_registry.v1.json"
      - "governance/galia_gradio_lite_dashboard_candidate.v0_1.json"
      - "governance/galia_gradio_lite_dashboard_deployment_receipt.v0_2.json"
      - "governance/galia_gradio_lite_runtime_recovery_receipt.v0_3.json"
      - "governance/safe_delete_execution_receipt.v1.json"
      - "governance/hf_final_release_candidate.v1.json"
      - "research/evidence/**"
      - "publisher/gradio_lite/**"
      - "tools/build_galia_dashboard.py"
      - "tools/build_galia_gradio_lite_dashboard.py"
      - "tests/test_galia_dashboard_publisher.py"
      - "tests/test_galia_gradio_lite_dashboard_v0_1.py"
      - ".github/workflows/galia-dashboard-publish.yml"
  push:
    branches: [main]
    paths:
      - "governance/galia_dashboard_authority_pointer.v1.json"
      - "governance/galia_dashboard_research_registry.v1.json"
      - "governance/galia_gradio_lite_dashboard_candidate.v0_1.json"
      - "governance/galia_gradio_lite_dashboard_deployment_receipt.v0_2.json"
      - "governance/galia_gradio_lite_runtime_recovery_receipt.v0_3.json"
      - "governance/safe_delete_execution_receipt.v1.json"
      - "governance/hf_final_release_candidate.v1.json"
      - "research/evidence/**"
      - "publisher/gradio_lite/**"
      - "tools/build_galia_dashboard.py"
      - "tools/build_galia_gradio_lite_dashboard.py"
      - "tests/test_galia_dashboard_publisher.py"
      - "tests/test_galia_gradio_lite_dashboard_v0_1.py"
      - ".github/workflows/galia-dashboard-publish.yml"

permissions:
  contents: read

concurrency:
  group: galia-gradio-lite-dashboard-publisher
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run dashboard tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_galia_dashboard_publisher.py \
            tests/test_galia_gradio_lite_dashboard_v0_1.py

      - name: Build and vendor patched Gradio Lite runtime
        run: |
          python tools/build_galia_gradio_lite_dashboard.py --output dist/gradio-lite/index.html
          cp publisher/gradio_lite/README.md dist/gradio-lite/README.md

          mkdir -p .tmp/gradio-lite dist/gradio-lite/vendor/gradio-lite
          TARBALL=$(npm pack @gradio/lite@5.45.0 --pack-destination .tmp/gradio-lite | tail -n 1)
          tar -xzf ".tmp/gradio-lite/$TARBALL" -C .tmp/gradio-lite
          cp -R .tmp/gradio-lite/package/dist/. dist/gradio-lite/vendor/gradio-lite/

          python - <<'PY'
          from pathlib import Path

          root = Path("dist/gradio-lite/vendor/gradio-lite")
          workers = list(root.rglob("webworker-*.js"))
          if not workers:
              raise SystemExit("No Gradio Lite webworker asset found")

          old = "https://cdn.jsdelivr.net/pyodide/v0.27.3/full/pyodide.js"
          new = "https://cdn.jsdelivr.net/pyodide/v0.27.6/full/pyodide.js"

          patched = 0
          for path in workers:
              text = path.read_text(encoding="utf-8")
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  patched += 1

          if patched != 1:
              raise SystemExit(f"Expected exactly one Pyodide runtime patch, got {patched}")

          print("GALIA_GRADIO_LITE_RUNTIME_PATCH=PASS")
          print("GALIA_GRADIO_LITE_PYODIDE=0.27.6")
          PY

          grep -q './vendor/gradio-lite/lite.js' dist/gradio-lite/index.html
          grep -q 'South Base · San Juan' dist/gradio-lite/index.html
          grep -q 'sdk: static' dist/gradio-lite/README.md
          grep -R -q 'pyodide/v0.27.6/full/pyodide.js' dist/gradio-lite/vendor/gradio-lite

      - name: Browser smoke test patched Gradio Lite
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

          python -m http.server 8765 --directory dist/gradio-lite >/tmp/galia-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          node - <<'JS'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];
            const failedRequests = [];

            page.on("pageerror", err => {
              const line = "PAGEERROR: " + String(err);
              errors.push(line);
              console.error(line);
            });
            page.on("console", msg => {
              const line = "CONSOLE[" + msg.type() + "]: " + msg.text();
              console.log(line);
              if (msg.type() === "error") errors.push(line);
            });
            page.on("requestfailed", req => {
              const line = "REQUESTFAILED: " + req.url() + " :: " + (req.failure()?.errorText || "");
              failedRequests.push(line);
              console.error(line);
            });

            await page.goto("http://127.0.0.1:8765/", {
              waitUntil: "domcontentloaded",
              timeout: 60000
            });

            try {
              await page.getByText("GALIA", { exact: false }).first().waitFor({
                timeout: 90000
              });
              await page.getByText("South Base · San Juan", { exact: false }).first().waitFor({
                timeout: 90000
              });
            } catch (err) {
              console.error("GALIA_BROWSER_RENDER_TIMEOUT");
              console.error("BODY_TEXT_START");
              console.error((await page.locator("body").innerText()).slice(0, 12000));
              console.error("BODY_TEXT_END");
              console.error("ERRORS_START");
              console.error(errors.join("\n"));
              console.error("ERRORS_END");
              console.error("FAILED_REQUESTS_START");
              console.error(failedRequests.join("\n"));
              console.error("FAILED_REQUESTS_END");
              throw err;
            }

            const body = await page.locator("body").innerText();
            const bad = [
              "Can't find a pure Python 3 wheel",
              "Traceback (most recent call last)",
              "Requested 'huggingface-hub"
            ];
            for (const marker of bad) {
              if (body.includes(marker)) {
                throw new Error("Runtime failure marker: " + marker);
              }
            }

            const relevant = errors.filter(x =>
              x.includes("micropip") ||
              x.includes("huggingface-hub") ||
              x.includes("PythonError") ||
              x.includes("Traceback")
            );
            if (relevant.length) {
              throw new Error(relevant.join("\n"));
            }

            console.log("GALIA_GRADIO_LITE_BROWSER_SMOKE=PASS");
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: galia-gradio-lite-dashboard
          path: dist/gradio-lite/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: galia-gradio-lite-dashboard
          path: artifact

      - name: Install Hugging Face client
        run: python -m pip install --disable-pip-version-check "huggingface_hub>=1.19,<2"

      - name: Publish Gradio Lite package to Junitos/GALIA
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("HF_TOKEN repository secret is missing")

          api = HfApi(token=token)
          info = api.upload_folder(
              folder_path="artifact",
              repo_id="Junitos/GALIA",
              repo_type="space",
              commit_message="Publish patched GALIA Gradio Lite dashboard",
          )
          print("GALIA_GRADIO_LITE_HF_PUBLISH=PASS")
          print(info)

          req = urllib.request.Request(
              "https://huggingface.co/api/spaces/Junitos/GALIA",
              headers={"Authorization": "Bearer " + token},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              meta = json.load(response)

          runtime = meta.get("runtime") or {}
          print("HF_SPACE_PRIVATE=" + str(meta.get("private")))
          print("HF_SPACE_SDK=" + str(meta.get("sdk")))
          print("HF_SPACE_SUBDOMAIN=" + str(meta.get("subdomain")))
          print("HF_SPACE_STAGE=" + str(runtime.get("stage")))
          print("HF_SPACE_SHA=" + str(meta.get("sha")))
          PY
