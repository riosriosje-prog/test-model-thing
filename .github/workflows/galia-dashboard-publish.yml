name: GALIA Gradio Lite dashboard publisher

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "governance/galia_dashboard_authority_pointer.v1.json"
      - "governance/galia_dashboard_research_registry.v1.json"
      - "governance/galia_gradio_lite_dashboard_candidate.v0_1.json"
      - "governance/galia_gradio_lite_runtime_recovery_receipt.v0_3.json"
      - "governance/galia_gradio_lite_runtime_recovery_receipt.v0_4.json"
      - "governance/galia_gradio_lite_dashboard_deployment_receipt.v0_2.json"
      - "governance/safe_delete_execution_receipt.v1.json"
      - "governance/hf_final_release_candidate.v1.json"
      - "research/evidence/**"
      - "publisher/gradio_lite/**"
      - "tools/build_galia_dashboard.py"
      - "tools/build_galia_gradio_lite_dashboard.py"
      - "tools/vendor_patch_gradio_lite_runtime.py"
      - "tests/test_galia_dashboard_publisher.py"
      - "tests/test_galia_gradio_lite_dashboard_v0_1.py"
      - "tests/smoke_galia_gradio_lite_webkit.py"
      - ".github/workflows/galia-dashboard-publish.yml"
  push:
    branches: [main]
    paths:
      - "governance/galia_dashboard_authority_pointer.v1.json"
      - "governance/galia_dashboard_research_registry.v1.json"
      - "governance/galia_gradio_lite_dashboard_candidate.v0_1.json"
      - "governance/galia_gradio_lite_runtime_recovery_receipt.v0_3.json"
      - "governance/galia_gradio_lite_runtime_recovery_receipt.v0_4.json"
      - "governance/galia_gradio_lite_dashboard_deployment_receipt.v0_2.json"
      - "governance/safe_delete_execution_receipt.v1.json"
      - "governance/hf_final_release_candidate.v1.json"
      - "research/evidence/**"
      - "publisher/gradio_lite/**"
      - "tools/build_galia_dashboard.py"
      - "tools/build_galia_gradio_lite_dashboard.py"
      - "tools/vendor_patch_gradio_lite_runtime.py"
      - "tests/test_galia_dashboard_publisher.py"
      - "tests/test_galia_gradio_lite_dashboard_v0_1.py"
      - "tests/smoke_galia_gradio_lite_webkit.py"
      - ".github/workflows/galia-dashboard-publish.yml"

permissions:
  contents: read

concurrency:
  group: galia-gradio-lite-dashboard-publisher
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run dashboard tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q             tests/test_galia_dashboard_publisher.py             tests/test_galia_gradio_lite_dashboard_v0_1.py
      - name: Vendor and patch Gradio Lite runtime
        run: |
          python tools/vendor_patch_gradio_lite_runtime.py --output dist/gradio-lite/runtime
          test -f dist/gradio-lite/runtime/lite.js
          test -f dist/gradio-lite/runtime/lite.css
          grep -R -q 'os.link unavailable in WASM' dist/gradio-lite/runtime
          if grep -R -q 'os.link = lambda src, dst: None' dist/gradio-lite/runtime; then
            echo "Broken Gradio Lite os.link shim survived patch" >&2
            exit 1
          fi
      - name: Build Gradio Lite dashboard from control plane
        run: |
          python tools/build_galia_gradio_lite_dashboard.py --output dist/gradio-lite/index.html
          cp publisher/gradio_lite/README.md dist/gradio-lite/README.md
          grep -q 'src="runtime/lite.js"' dist/gradio-lite/index.html
          grep -q 'South Base · San Juan' dist/gradio-lite/index.html
          grep -q 'sdk: static' dist/gradio-lite/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: galia-gradio-lite-dashboard
          path: dist/gradio-lite/

  webkit-smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: galia-gradio-lite-dashboard
          path: dist/gradio-lite
      - name: Install Playwright WebKit
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps webkit
      - name: Serve built dashboard
        run: |
          python -m http.server 8000 --directory dist/gradio-lite > /tmp/galia-http.log 2>&1 &
          echo $! > /tmp/galia-http.pid
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/", timeout=1) as r:
                      if r.status == 200:
                          print("GALIA_STATIC_SERVER=READY")
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("static server failed to start")
          PY
      - name: Run WebKit runtime smoke
        run: python tests/smoke_galia_gradio_lite_webkit.py
      - name: Upload WebKit smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galia-gradio-lite-webkit-smoke
          path: |
            dist/smoke/
            /tmp/galia-http.log
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [validate, webkit-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: galia-gradio-lite-dashboard
          path: artifact
      - name: Install Hugging Face client
        run: python -m pip install --disable-pip-version-check "huggingface_hub>=1.19,<2"
      - name: Publish Gradio Lite package to Junitos/GALIA
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("HF_TOKEN repository secret is missing")

          api = HfApi(token=token)
          info = api.upload_folder(
              folder_path="artifact",
              repo_id="Junitos/GALIA",
              repo_type="space",
              commit_message="Publish GALIA Gradio Lite dashboard",
          )
          print("GALIA_GRADIO_LITE_HF_PUBLISH=PASS")
          print(info)

          req = urllib.request.Request(
              "https://huggingface.co/api/spaces/Junitos/GALIA",
              headers={"Authorization": "Bearer " + token},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              meta = json.load(response)

          runtime = meta.get("runtime") or {}
          print("HF_SPACE_PRIVATE=" + str(meta.get("private")))
          print("HF_SPACE_SDK=" + str(meta.get("sdk")))
          print("HF_SPACE_SUBDOMAIN=" + str(meta.get("subdomain")))
          print("HF_SPACE_STAGE=" + str(runtime.get("stage")))
          print("HF_SPACE_SHA=" + str(meta.get("sha")))
          PY
