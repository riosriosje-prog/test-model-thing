name: GALIA Gradio Lite candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "governance/galia_gradio_lite_dashboard_candidate.v0_1.json"
      - "governance/galia_gradio_lite_runtime_recovery_receipt.v0_3.json"
      - "publisher/gradio_lite/**"
      - "tools/build_galia_gradio_lite_dashboard.py"
      - "tests/test_galia_gradio_lite_dashboard_v0_1.py"
      - ".github/workflows/galia-gradio-lite-candidate.yml"
      - "governance/galia_dashboard_authority_pointer.v1.json"
      - "governance/galia_dashboard_research_registry.v1.json"
      - "research/evidence/**"

permissions:
  contents: read

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run candidate tests
        run: python -m pytest -q tests/test_galia_gradio_lite_dashboard_v0_1.py
      - name: Inspect upstream pinned Gradio Lite bundle
        run: |
          python - <<'PY'
          import re, urllib.request
          base="https://gradio-lite-previews.s3.amazonaws.com/PINNED_HF_HUB/dist/"
          data=urllib.request.urlopen(base+"lite.js", timeout=30).read().decode("utf-8","replace")
          print("LITE_JS_BYTES", len(data))
          refs=sorted(set(re.findall(r'(?:\./)?assets/[A-Za-z0-9_.-]+', data)))
          for ref in refs:
              print("ASSET_REF", ref)
          for pat in ("webworker","gradio_client","gradio-","\.whl"):
              hits=sorted(set(re.findall(r'.{0,80}'+pat+r'.{0,120}', data, re.I)))
              for hit in hits[:20]:
                  print("MATCH", pat, hit)
          PY
      - name: Inspect upstream worker filelock shim
        run: |
          python - <<'PY'
          import urllib.request
          url="https://gradio-lite-previews.s3.amazonaws.com/PINNED_HF_HUB/dist/assets/webworker-BsZ7XNFH.js"
          worker=urllib.request.urlopen(url, timeout=30).read().decode("utf-8","replace")
          print("WORKER_BYTES", len(worker))
          import base64
          for needle in ("os.link", "lambda src", "Mocking os module methods", "follow_symlinks"):
              pos=worker.find(needle)
              print("WORKER_NEEDLE", repr(needle), pos)
              if pos >= 0:
                  print("WORKER_SNIPPET", worker[max(0,pos-500):pos+1000])
          print("WORKER_B64="+base64.b64encode(worker.encode()).decode())
          PY
      - name: Build candidate
        run: python tools/build_galia_gradio_lite_dashboard.py --output dist/gradio-lite/index.html
      - name: Enforce promoted read-only boundary
        run: |
          test -f dist/gradio-lite/index.html
          grep -q 'gradio-lite-previews.s3.amazonaws.com/PINNED_HF_HUB/dist/lite.js' dist/gradio-lite/index.html
          grep -q 'READ ONLY' dist/gradio-lite/index.html
          grep -q 'PROMOTED_DEPLOY_AUTHORIZED' governance/galia_gradio_lite_dashboard_candidate.v0_1.json
      - uses: actions/upload-artifact@v4
        with:
          name: galia-gradio-lite-dashboard-candidate-v0.1
          path: |
            dist/gradio-lite/index.html
            publisher/gradio_lite/README.md
            governance/galia_gradio_lite_dashboard_candidate.v0_1.json
