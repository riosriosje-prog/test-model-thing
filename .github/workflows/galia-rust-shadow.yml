name: GALIA Rust shadow conformance

on:
  pull_request:
    paths:
      - 'rust/galia-core/**'
      - '.github/workflows/galia-rust-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Default read-only Rust tests
        run: cargo test --manifest-path rust/galia-core/Cargo.toml --all-targets
      - name: Opt-in signed replay anchors and durable rollback/race tests
        run: cargo test --manifest-path rust/galia-core/Cargo.toml --all-targets --features scratch-store
      - name: Opt-in real rustls TLS 1.3 mTLS loopback transport tests
        run: cargo test --manifest-path rust/galia-core/Cargo.toml --all-targets --features tls-transport
      - name: Explicit real mTLS server nonce and restart tests
        run: cargo test --manifest-path rust/galia-core/Cargo.toml --test mtls_checkpoint_server --features tls-transport
      - name: Two isolated server replicas and signed recovery tests
        run: cargo test --manifest-path rust/galia-core/Cargo.toml --test mtls_checkpoint_server --features tls-transport recovery_tests
      - name: Shared scratch coordinator epoch and real TLS replica race tests
        run: cargo test --manifest-path rust/galia-core/Cargo.toml --test mtls_checkpoint_server --features tls-transport fencing_tests
      - name: Commit-point epoch fencing and atomic response record tests
        run: cargo test --manifest-path rust/galia-core/Cargo.toml --test mtls_checkpoint_server --features tls-transport fencing_tests
      - name: Remote authenticated coordinator and real TLS roundtrip tests
        run: cargo test --manifest-path rust/galia-core/Cargo.toml --test mtls_checkpoint_server --features tls-transport network_fencing_tests
      - name: Authenticated origin-only receipt recovery and replay tests
        run: cargo test --manifest-path rust/galia-core/Cargo.toml --test mtls_checkpoint_server --features tls-transport network_fencing_tests
      - name: Strict external high-water CAS and rollback tests
        run: cargo test --manifest-path rust/galia-core/Cargo.toml --test mtls_checkpoint_server --features tls-transport network_fencing_tests
      - name: Persistent separate-root monotonic anchor and rollback/restart tests
        run: cargo test --manifest-path rust/galia-core/Cargo.toml --test mtls_checkpoint_server --features tls-transport network_fencing_tests
      - name: Offline signed dual-root high-water antirollback audit tests
        run: cargo test --manifest-path rust/galia-core/Cargo.toml --test mtls_checkpoint_server --features tls-transport network_fencing_tests
      - name: Offline dual-signed auditor log equivocation adversarial tests
        run: cargo test --manifest-path rust/galia-core/Cargo.toml --test audit_equivocation --features tls-transport
      - name: Offline signed fork witness quorum and negative controls
        run: cargo test --manifest-path rust/galia-core/Cargo.toml --test fork_witness --features tls-transport
      - name: Build six read-only Rust CLIs
        run: cargo build --manifest-path rust/galia-core/Cargo.toml --bins
      - name: Original Python P2 P6 P7 reference tests
        run: |
          python -m unittest discover -s tests -p 'test_galia2_state_machine.py' -v
          python -m unittest discover -s tests -p 'test_galia2_preflight.py' -v
          python -m unittest discover -s tests -p 'test_galia2_persistence.py' -v
      - name: Python Rust differential conformance
        run: python -m unittest discover -s rust/galia-core/tests -p 'test_*.py' -v
