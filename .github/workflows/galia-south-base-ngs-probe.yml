name: GALIA South Base NGS gate probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tools/probe_south_base_ngs.py"
      - "tools/validate_south_base_gates.py"
      - "research/gates/south_base_gates.v0_2.json"
      - ".github/workflows/galia-south-base-ngs-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install geodesic dependency
        run: python -m pip install --disable-pip-version-check pyproj
      - name: Probe NGS API and Puerto Rico datasheet archive
        run: python tools/probe_south_base_ngs.py
      - name: Validate South Base gate state
        run: python tools/validate_south_base_gates.py
      - name: Upload read-only NGS probe receipt
        uses: actions/upload-artifact@v4
        with:
          name: south-base-ngs-probe
          path: research/gates/derived/south_base_ngs_radial_probe.v0_1.json
          if-no-files-found: error
          retention-days: 90
