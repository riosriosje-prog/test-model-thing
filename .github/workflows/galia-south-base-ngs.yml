name: GALIA South Base NGS gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tools/probe_south_base_ngs.py"
      - ".github/workflows/galia-south-base-ngs.yml"
      - "research/evidence/south_base.v1.json"
  push:
    branches: [main]
    paths:
      - "tools/probe_south_base_ngs.py"
      - ".github/workflows/galia-south-base-ngs.yml"
      - "research/evidence/south_base.v1.json"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check pyshp
      - name: Probe NGS current API and Puerto Rico archive
        run: python tools/probe_south_base_ngs.py
      - uses: actions/upload-artifact@v4
        with:
          name: south-base-ngs-gate
          path: south-base-gate-output/
          retention-days: 30
