name: hf8-backend-throughput-probe-v2

on:
  push:
    branches:
      - galia2/hf8-retrain-v0.1
    paths:
      - .github/workflows/hf8-backend-throughput-probe-v2.yml

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install MLX CPU
        run: python -m pip install --upgrade "mlx[cpu]==0.32.2"
      - name: Probe Linux throughput
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import platform
          import time
          from importlib.metadata import version
          import mlx.core as mx
          from main import Model

          mx.random.seed(1976)
          model = Model(dim=512, layers=16, spread=32, temp=0.75, lr=5e-4, lrbegin=40000, lrend=120000)
          data = (b"The quick brown fox jumps over the lazy dog. GALIA throughput probe.\n" * 64)
          steps = 1000
          started = time.perf_counter()
          for i in range(steps):
              j = i % (len(data) - 1)
              model(data[j], data[j + 1], j == len(data) - 2, frozen=False)
          elapsed = time.perf_counter() - started
          out = {
              "backend": "linux-cpu",
              "machine": platform.machine(),
              "mlx_version": version("mlx"),
              "steps": steps,
              "elapsed_seconds": elapsed,
              "steps_per_second": steps / elapsed,
              "benchmark_only": True,
              "artifact_eligible": False,
          }
          with open("linux-throughput.json", "w", encoding="utf-8") as fh:
              json.dump(out, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(f"HF8_BACKEND_LINUX_STEPS_S={out['steps_per_second']}")
          print(f"HF8_BACKEND_LINUX_MACHINE={out['machine']}")
          print("HF8_BACKEND_BENCHMARK_ONLY=true")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HF8_BACKEND_LINUX_PROBE_V2
          path: linux-throughput.json
          retention-days: 30

  macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install MLX
        run: python -m pip install --upgrade "mlx==0.32.2"
      - name: Probe macOS throughput
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import platform
          import time
          from importlib.metadata import version
          import mlx.core as mx
          from main import Model

          mx.random.seed(1976)
          model = Model(dim=512, layers=16, spread=32, temp=0.75, lr=5e-4, lrbegin=40000, lrend=120000)
          data = (b"The quick brown fox jumps over the lazy dog. GALIA throughput probe.\n" * 64)
          steps = 1000
          started = time.perf_counter()
          for i in range(steps):
              j = i % (len(data) - 1)
              model(data[j], data[j + 1], j == len(data) - 2, frozen=False)
          elapsed = time.perf_counter() - started
          out = {
              "backend": "macos",
              "machine": platform.machine(),
              "mlx_version": version("mlx"),
              "steps": steps,
              "elapsed_seconds": elapsed,
              "steps_per_second": steps / elapsed,
              "benchmark_only": True,
              "artifact_eligible": False,
          }
          with open("macos-throughput.json", "w", encoding="utf-8") as fh:
              json.dump(out, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(f"HF8_BACKEND_MACOS_STEPS_S={out['steps_per_second']}")
          print(f"HF8_BACKEND_MACOS_MACHINE={out['machine']}")
          print("HF8_BACKEND_BENCHMARK_ONLY=true")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HF8_BACKEND_MACOS_PROBE_V2
          path: macos-throughput.json
          retention-days: 30
