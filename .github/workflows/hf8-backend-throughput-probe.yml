name: hf8-backend-throughput-probe

on:
  push:
    branches:
      - galia2/hf8-retrain-v0.1
    paths:
      - .github/workflows/hf8-backend-throughput-probe.yml

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install MLX CPU
        run: python -m pip install --upgrade "mlx[cpu]==0.32.2"
      - name: Probe Linux throughput
        run: |
          python - <<'PY'
          import json, platform, time
          from importlib.metadata import version
          import mlx.core as mx
          from main import Model

          mx.random.seed(1976)
          m=Model(dim=512,layers=16,spread=32,temp=0.75,lr=5e-4,lrbegin=40000,lrend=120000)
          data=(b"The quick brown fox jumps over the lazy dog. GALIA throughput probe.\n"*64)
          steps=1000
          started=time.time()
          for i in range(steps):
              j=i%(len(data)-1)
              m(data[j],data[j+1],j==len(data)-2,frozen=False)
          elapsed=time.time()-started
          out={
              "gate":"HF8_BACKEND_THROUGHPUT_PROBE",
              "backend":"linux-cpu",
              "machine":platform.machine(),
              "platform":platform.platform(),
              "mlx_version":version("mlx"),
              "steps":steps,
              "elapsed_seconds":elapsed,
              "steps_per_second":steps/elapsed,
              "artifact_eligible":False,
              "benchmark_only":True
          }
          open("linux-throughput.json","w").write(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("HF8_BACKEND_LINUX_STEPS_S="+str(out["steps_per_second"]))
          print("HF8_BACKEND_LINUX_MACHINE="+out["machine"])
          print("HF8_BACKEND_BENCHMARK_ONLY=true")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HF8_BACKEND_LINUX_PROBE
          path: linux-throughput.json
          retention-days: 30

  macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install MLX
        run: python -m pip install --upgrade "mlx==0.32.2"
      - name: Probe macOS throughput
        run: |
          python - <<'PY'
          import json, platform, time
          from importlib.metadata import version
          import mlx.core as mx
          from main import Model

          mx.random.seed(1976)
          m=Model(dim=512,layers=16,spread=32,temp=0.75,lr=5e-4,lrbegin=40000,lrend=120000)
          data=(b"The quick brown fox jumps over the lazy dog. GALIA throughput probe.\n"*64)
          steps=1000
          started=time.time()
          for i in range(steps):
              j=i%(len(data)-1)
              m(data[j],data[j+1],j==len(data)-2,frozen=False)
          elapsed=time.time()-started
          out={
              "gate":"HF8_BACKEND_THROUGHPUT_PROBE",
              "backend":"macos",
              "machine":platform.machine(),
              "platform":platform.platform(),
              "mlx_version":version("mlx"),
              "steps":steps,
              "elapsed_seconds":elapsed,
              "steps_per_second":steps/elapsed,
              "artifact_eligible":False,
              "benchmark_only":True
          }
          open("macos-throughput.json","w").write(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("HF8_BACKEND_MACOS_STEPS_S="+str(out["steps_per_second"]))
          print("HF8_BACKEND_MACOS_MACHINE="+out["machine"])
          print("HF8_BACKEND_BENCHMARK_ONLY=true")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HF8_BACKEND_MACOS_PROBE
          path: macos-throughput.json
          retention-days: 30
