name: hf8-publish-weight-candidate

on:
  push:
    branches:
      - galia2/hf8-retrain-v0.1
    paths:
      - .github/workflows/hf8-publish-weight-candidate.yml

permissions:
  contents: read

jobs:
  publish-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_REPO_ID: Junitos/galia-2
      STAGING_REVISION: hf8-retrain-v0.1
      STAGING_PATH: training/hf8-retrain-v0.1
      CANDIDATE_PATH: weights/hf8-retrain-bootstrap-v0.1
      EXPECTED_PAYLOAD_SHA256: 416fb2d83c56c08028931e6e907b184f211f0267f626a67ff132d2298b9db151
      EXPECTED_PAYLOAD_BYTES: "70716953"
      TRAINING_RUN_ID: "36180858190"
      PREFLIGHT_RUN_ID: "36181500959"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Hugging Face client
        run: python -m pip install --upgrade "huggingface_hub>=1.0,<2"

      - name: Download and freeze exact staging bytes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from huggingface_hub import snapshot_download

          def sha256_file(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for b in iter(lambda:f.read(1024*1024),b""):
                      h.update(b)
              return h.hexdigest()

          root=Path(snapshot_download(
              repo_id=os.environ["HF_REPO_ID"],
              repo_type="model",
              revision=os.environ["STAGING_REVISION"],
              token=os.environ["HF_TOKEN"],
              allow_patterns=[os.environ["STAGING_PATH"]+"/**"],
              local_dir=".hf8-candidate-source",
          ))
          src=root/os.environ["STAGING_PATH"]
          tr=json.loads((src/"training-receipt.json").read_text())
          if tr["payload_sha256"] != os.environ["EXPECTED_PAYLOAD_SHA256"]:
              raise SystemExit("staging payload SHA mismatch")
          if int(tr["payload_bytes"]) != int(os.environ["EXPECTED_PAYLOAD_BYTES"]):
              raise SystemExit("staging payload size mismatch")

          out=Path(".hf8-weight-candidate")
          out.mkdir(parents=True,exist_ok=True)
          rows=[]
          for p in sorted(x for x in src.rglob("*") if x.is_file()):
              rel=p.relative_to(src)
              dest=out/rel
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(p.read_bytes())
              rows.append({
                  "path":rel.as_posix(),
                  "bytes":dest.stat().st_size,
                  "sha256":sha256_file(dest),
              })

          manifest={
              "candidate":"HF8_REAL_WEIGHT_CANDIDATE_v0.1",
              "artifact_kind":"REAL_TRAINED_CHECKPOINT",
              "repo_id":os.environ["HF_REPO_ID"],
              "candidate_path":os.environ["CANDIDATE_PATH"],
              "source_staging_revision":os.environ["STAGING_REVISION"],
              "source_staging_path":os.environ["STAGING_PATH"],
              "payload_sha256":os.environ["EXPECTED_PAYLOAD_SHA256"],
              "payload_bytes":int(os.environ["EXPECTED_PAYLOAD_BYTES"]),
              "training_run_id":int(os.environ["TRAINING_RUN_ID"]),
              "preflight_run_id":int(os.environ["PREFLIGHT_RUN_ID"]),
              "classification":"GALIA_CURRENT_BOUND",
              "authority_binding":"CURRENT_BOUND",
              "promotion_scope":"HF8_REAL_WEIGHT_BOOTSTRAP_ONLY",
              "canonical_authority_transferred":False,
              "human_promotion_required":True,
              "files":rows,
          }
          mp=out/"HF8_WEIGHT_CANDIDATE_MANIFEST.json"
          mp.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("HF8_WEIGHT_CANDIDATE_FREEZE=PASS")
          print("HF8_WEIGHT_CANDIDATE_MANIFEST_SHA256="+sha256_file(mp))
          print("HF8_WEIGHT_CANDIDATE_FILE_COUNT="+str(len(rows)+1))
          PY

      - name: Publish exact bytes as Hugging Face PR
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, tempfile
          from pathlib import Path
          from huggingface_hub import HfApi, snapshot_download

          def sha256_file(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for b in iter(lambda:f.read(1024*1024),b""):
                      h.update(b)
              return h.hexdigest()

          def tree(root):
              return {
                  p.relative_to(root).as_posix():{
                      "bytes":p.stat().st_size,
                      "sha256":sha256_file(p),
                  }
                  for p in sorted(x for x in root.rglob("*") if x.is_file())
              }

          token=os.environ["HF_TOKEN"]
          repo=os.environ["HF_REPO_ID"]
          local=Path(".hf8-weight-candidate")
          local_tree=tree(local)
          api=HfApi(token=token)
          info=api.upload_folder(
              repo_id=repo,
              repo_type="model",
              folder_path=str(local),
              path_in_repo=os.environ["CANDIDATE_PATH"],
              commit_message="GALIA HF8 real retrained weight candidate v0.1",
              commit_description=(
                  "Real trained bootstrap checkpoint only. "
                  "Human promotion required; GitHub remains canonical."
              ),
              create_pr=True,
          )
          pr_url=str(getattr(info,"pr_url",""))
          m=re.search(r"/discussions/(\d+)",pr_url)
          if not m:
              raise SystemExit("Hugging Face upload did not return a PR URL")
          pr=int(m.group(1))
          revision=f"refs/pr/{pr}"

          with tempfile.TemporaryDirectory() as td:
              root=Path(snapshot_download(
                  repo_id=repo,
                  repo_type="model",
                  revision=revision,
                  token=token,
                  allow_patterns=[os.environ["CANDIDATE_PATH"]+"/**"],
                  local_dir=td,
              ))
              remote=root/os.environ["CANDIDATE_PATH"]
              remote_tree=tree(remote)

          if remote_tree != local_tree:
              raise SystemExit("remote candidate bytes differ from frozen local candidate")

          manifest=local/"HF8_WEIGHT_CANDIDATE_MANIFEST.json"
          receipt={
              "repo_id":repo,
              "repo_type":"model",
              "pr_number":pr,
              "pr_url":pr_url,
              "verified_revision":revision,
              "candidate_path":os.environ["CANDIDATE_PATH"],
              "manifest_sha256":sha256_file(manifest),
              "payload_sha256":os.environ["EXPECTED_PAYLOAD_SHA256"],
              "payload_bytes":int(os.environ["EXPECTED_PAYLOAD_BYTES"]),
              "verified_file_count":len(local_tree),
              "classification":"GALIA_CURRENT_BOUND",
              "authority_binding":"CURRENT_BOUND",
              "promotion_scope":"HF8_REAL_WEIGHT_BOOTSTRAP_ONLY",
              "canonical_authority_transferred":False,
              "human_promotion_required":True,
              "promoted":False,
          }
          Path("hf8-weight-candidate-remote-receipt.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n"
          )
          print("HF8_WEIGHT_REMOTE_PR_PUBLISH=PASS")
          print("HF8_WEIGHT_REMOTE_PR_VERIFY=PASS")
          print("HF8_WEIGHT_REMOTE_PR_NUMBER="+str(pr))
          print("HF8_WEIGHT_REMOTE_PR_URL="+pr_url)
          print("HF8_WEIGHT_REMOTE_MANIFEST_SHA256="+receipt["manifest_sha256"])
          print("HF8_WEIGHT_REMOTE_VERIFIED_FILES="+str(len(local_tree)))
          print("HF8_WEIGHT_PROMOTED=false")
          PY

      - name: Upload exact candidate receipt
        uses: actions/upload-artifact@v4
        with:
          name: GALIA_HF8_REAL_WEIGHT_CANDIDATE
          path: |
            .hf8-weight-candidate/HF8_WEIGHT_CANDIDATE_MANIFEST.json
            hf8-weight-candidate-remote-receipt.json
          if-no-files-found: error
          retention-days: 90
