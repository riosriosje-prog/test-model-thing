name: hf8-retrain-bootstrap

on:
  push:
    branches:
      - galia2/hf8-retrain-v0.1
    paths:
      - .github/workflows/hf8-retrain-bootstrap.yml
      - tools/hf8_prepare_simplewiki.py
      - tools/hf8_retrain_chunk.py
      - tools/hf8_publish_training_snapshot.py
      - docs/HF8_RETRAIN_V0_1.md

permissions:
  contents: read

concurrency:
  group: hf8-retrain-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SIMPLEWIKI_URL: https://dumps.wikimedia.org/other/mediawiki_content_current/simplewiki/2026-08-01/xml/bzip2/simplewiki-2026-08-01-p1p1277745.xml.bz2
      TRAIN_STEPS: "4000"
      CORPUS_TARGET_BYTES: "16777216"
      HF_REPO_ID: Junitos/galia-2
      HF_REVISION: hf8-retrain-v0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned runtime
        run: python -m pip install --upgrade "mlx[cpu]==0.32.2" "huggingface_hub>=1.0,<2"

      - name: Secret gate
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          echo "HF8_RETRAIN_SECRET_GATE=PASS"

      - name: Download exact dated SimpleWiki dump
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hf8/data .hf8/out
          curl --fail --location --retry 4 --retry-delay 5 \
            "$SIMPLEWIKI_URL" \
            --output .hf8/data/simplewiki-20260801.xml.bz2
          test -s .hf8/data/simplewiki-20260801.xml.bz2
          echo "HF8_DUMP_DOWNLOAD=PASS"

      - name: Build deterministic training corpus
        run: |
          python tools/hf8_prepare_simplewiki.py \
            --dump .hf8/data/simplewiki-20260801.xml.bz2 \
            --output .hf8/data/corpus.txt \
            --receipt .hf8/out/corpus-receipt.json \
            --target-bytes "$CORPUS_TARGET_BYTES" \
            --source-url "$SIMPLEWIKI_URL"

      - name: Train real 4.5M bootstrap checkpoint
        run: |
          python tools/hf8_retrain_chunk.py \
            --corpus .hf8/data/corpus.txt \
            --corpus-receipt .hf8/out/corpus-receipt.json \
            --checkpoint-target .hf8/out/galia-hf8-4p5m \
            --state .hf8/out/training-state.json \
            --receipt .hf8/out/training-receipt.json \
            --steps "$TRAIN_STEPS" \
            --seed 1976

      - name: Publish to isolated Hugging Face staging branch and re-read
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python tools/hf8_publish_training_snapshot.py \
            --folder .hf8/out \
            --repo-id "$HF_REPO_ID" \
            --revision "$HF_REVISION" \
            --path-in-repo training/hf8-retrain-v0.1 \
            --token "$HF_TOKEN"

      - name: Upload GitHub evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: GALIA_HF8_REAL_TRAINED_BOOTSTRAP
          path: .hf8/out/
          if-no-files-found: error
          retention-days: 90
