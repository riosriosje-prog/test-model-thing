name: hf8-staged-weight-preflight

on:
  push:
    branches:
      - galia2/hf8-retrain-v0.1
    paths:
      - .github/workflows/hf8-staged-weight-preflight.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_REPO_ID: Junitos/galia-2
      HF_REVISION: hf8-retrain-v0.1
      HF_PATH: training/hf8-retrain-v0.1
      EXPECTED_PAYLOAD_SHA256: 416fb2d83c56c08028931e6e907b184f211f0267f626a67ff132d2298b9db151
      EXPECTED_PAYLOAD_BYTES: "70716953"
      EXPECTED_CORPUS_SHA256: c4629bb527a8fef0b405d07e2518e7c52a13fa63046c1e457e9f12013b388b29
      EXPECTED_DUMP_SHA256: 441fb855b3d907afe605b00482968e894b94798ffbe870c24be09c4e500edacb
      TRAINING_RUN_ID: "36180858190"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned validation runtime
        run: python -m pip install --upgrade "mlx[cpu]==0.32.2" "huggingface_hub>=1.0,<2"

      - name: Download exact HF staging snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          root = snapshot_download(
              repo_id=os.environ["HF_REPO_ID"],
              repo_type="model",
              revision=os.environ["HF_REVISION"],
              token=os.environ["HF_TOKEN"],
              allow_patterns=[os.environ["HF_PATH"] + "/**"],
              local_dir=".hf8-verify",
          )
          print("HF8_STAGED_DOWNLOAD=PASS")
          print("HF8_STAGED_ROOT=" + root)
          PY

      - name: Bind training provenance
        shell: bash
        run: |
          set -euo pipefail
          ROOT=".hf8-verify/$HF_PATH"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(".hf8-verify") / os.environ["HF_PATH"]
          tr = json.loads((root / "training-receipt.json").read_text())
          cr = json.loads((root / "corpus-receipt.json").read_text())

          assert tr["artifact_kind"] == "REAL_TRAINED_CHECKPOINT"
          assert tr["payload_sha256"] == os.environ["EXPECTED_PAYLOAD_SHA256"]
          assert int(tr["payload_bytes"]) == int(os.environ["EXPECTED_PAYLOAD_BYTES"])
          assert tr["corpus_sha256"] == os.environ["EXPECTED_CORPUS_SHA256"]
          assert cr["dump_sha256"] == os.environ["EXPECTED_DUMP_SHA256"]
          assert tr["authority_binding"] == "CURRENT_BOUND"
          assert tr["legacy_unbound_taint"] is False
          assert int(tr["cumulative_steps"]) == 4000

          provenance = {
              "origin_type": "galia_reproducible_retrain",
              "obtained_from": (
                  "GitHub Actions run " + os.environ["TRAINING_RUN_ID"] +
                  " staged to " + os.environ["HF_REPO_ID"] + "@" + os.environ["HF_REVISION"]
              ),
              "training_dataset": (
                  "SimpleWiki 2026-08-01; dump_sha256=" + cr["dump_sha256"] +
                  "; corpus_sha256=" + cr["corpus_sha256"]
              ),
              "training_description": (
                  "GALIA current checkpoint protocol; dim=512; layers=16; spread=32; "
                  "seed=1976; 4000 optimizer steps; source_sha=" + str(tr["source_sha"])
              ),
              "trainer_or_custodian": "riosriosje-prog via GitHub Actions",
              "claimed_not_synthetic": True,
              "training_run_id": int(os.environ["TRAINING_RUN_ID"]),
              "payload_sha256": tr["payload_sha256"],
              "payload_bytes": tr["payload_bytes"],
              "cumulative_steps": tr["cumulative_steps"],
          }
          Path("hf8-provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n"
          )
          print("HF8_PROVENANCE_BINDING=PASS")
          PY

      - name: Run promoted HF8 intake gate against remote bytes
        shell: bash
        run: |
          set -euo pipefail
          TARGET=".hf8-verify/$HF_PATH/galia-hf8-4p5m"
          python tools/hf8_weight_intake.py \
            --target "$TARGET" \
            --provenance hf8-provenance.json \
            --output hf8-staged-weight-intake-receipt.json

      - name: Exact pre-promotion assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          doc = json.loads(Path("hf8-staged-weight-intake-receipt.json").read_text())
          art = doc["artifact"]
          assert doc["status"] == "PASS_INTAKE"
          assert art["classification"] == "GALIA_CURRENT_BOUND"
          assert art["authority_binding"] == "CURRENT_BOUND"
          assert art["payload_sha256"] == os.environ["EXPECTED_PAYLOAD_SHA256"]
          assert int(art["payload_bytes"]) == int(os.environ["EXPECTED_PAYLOAD_BYTES"])
          assert doc["provenance_status"]["status"] == "COMPLETE"
          assert doc["technical_upload_eligible"] is True
          assert doc["promotion_preflight_eligible"] is True
          assert doc["human_promotion_required"] is True
          assert doc["automatic_upload_performed"] is False
          assert doc["automatic_promotion_performed"] is False
          assert doc["canonical_authority_transferred"] is False
          print("HF8_REAL_WEIGHT_PREFLIGHT=PASS")
          print("HF8_REAL_WEIGHT_CLASSIFICATION=GALIA_CURRENT_BOUND")
          print("HF8_REAL_WEIGHT_PROMOTION_ELIGIBLE=true")
          print("HF8_REAL_WEIGHT_PROMOTED=false")
          PY

      - name: Upload pre-promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: GALIA_HF8_REAL_WEIGHT_PREFLIGHT
          path: |
            hf8-provenance.json
            hf8-staged-weight-intake-receipt.json
          if-no-files-found: error
          retention-days: 90
