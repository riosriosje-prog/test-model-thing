name: hf8-staging-validation

on:
  push:
    branches:
      - galia2/hf8-retrain-v0.1
    paths:
      - .github/workflows/hf8-staging-validation.yml
      - tools/hf8_validate_staged_checkpoint.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SIMPLEWIKI_URL: https://dumps.wikimedia.org/other/mediawiki_content_current/simplewiki/2026-08-01/xml/bzip2/simplewiki-2026-08-01-p1p1277745.xml.bz2
      HF_REPO_ID: Junitos/galia-2
      HF_REVISION: hf8-retrain-v0.1
      HF_PATH: training/hf8-retrain-v0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned runtime
        run: python -m pip install --upgrade "mlx[cpu]==0.32.2" "huggingface_hub>=1.0,<2"

      - name: Secret gate
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          echo "HF8_STAGING_SECRET_GATE=PASS"

      - name: Rebuild exact training corpus independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hf8-validation/data .hf8-validation/staging .hf8-validation/out
          curl --fail --location --retry 4 --retry-delay 5 \
            "$SIMPLEWIKI_URL" \
            --output .hf8-validation/data/simplewiki-20260801.xml.bz2
          python tools/hf8_prepare_simplewiki.py \
            --dump .hf8-validation/data/simplewiki-20260801.xml.bz2 \
            --output .hf8-validation/data/corpus.txt \
            --receipt .hf8-validation/out/local-corpus-receipt.json \
            --target-bytes 16777216 \
            --source-url "$SIMPLEWIKI_URL"

      - name: Download staged checkpoint snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ["HF_REPO_ID"],
              repo_type="model",
              revision=os.environ["HF_REVISION"],
              token=os.environ["HF_TOKEN"],
              allow_patterns=[os.environ["HF_PATH"] + "/**"],
              local_dir=".hf8-validation/staging",
          )
          print("HF8_STAGING_DOWNLOAD=PASS")
          PY

      - name: Validate current generation and frozen held-out evaluation
        run: |
          python tools/hf8_validate_staged_checkpoint.py \
            --snapshot-root ".hf8-validation/staging/$HF_PATH" \
            --corpus .hf8-validation/data/corpus.txt \
            --corpus-receipt .hf8-validation/out/local-corpus-receipt.json \
            --receipt .hf8-validation/out/staging-validation-receipt.json \
            --heldout-bytes 32768

      - name: Upload validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: GALIA_HF8_STAGING_VALIDATION
          path: .hf8-validation/out/
          if-no-files-found: error
          retention-days: 90
