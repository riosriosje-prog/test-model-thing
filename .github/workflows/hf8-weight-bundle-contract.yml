name: hf8-weight-bundle-contract

on:
  push:
    branches:
      - galia2/hf8-weight-bundle-contract-v0.3
    paths:
      - .github/workflows/hf8-weight-bundle-contract.yml
      - tools/hf8_weight_bundle_validate.py
      - tests/test_hf8_weight_bundle.py
      - huggingface/weights/HF8_WEIGHT_BUNDLE.schema.json
      - docs/HF8_WEIGHT_BUNDLE_CONTRACT.md
      - receipts/huggingface/hf8-weight-bundle-contract-v0.3.json

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run additive bundle-contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_hf8_weight_bundle -v
          echo "HF8_WEIGHT_BUNDLE_CONTRACT=PASS"
          echo "HF8_WEIGHT_ARTIFACT_GATE=HOLD"
