name: hf8-weight-intake-validation

on:
  push:
    branches:
      - galia2/hf8-weight-intake-v0.1
    paths:
      - .github/workflows/hf8-weight-intake-validation.yml
      - tools/hf8_weight_intake.py
      - tests/test_hf8_weight_intake.py
      - docs/HF8_WEIGHT_INTAKE_GATE.md
      - receipts/huggingface/hf8-discovery-audit-v0.2.json
  pull_request:
    paths:
      - tools/hf8_weight_intake.py
      - tests/test_hf8_weight_intake.py
      - docs/HF8_WEIGHT_INTAKE_GATE.md

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned MLX CPU backend
        run: python -m pip install --upgrade "mlx[cpu]==0.32.2"
      - name: Compile intake tool
        run: python -m py_compile tools/hf8_weight_intake.py
      - name: Run HF8 intake tests
        run: python -m unittest tests.test_hf8_weight_intake -v
      - name: Assert no real weight fixture is committed
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.safetensors' -o -name '*.ckpt' -o -name '*.pt' -o -name '*.pth' -o -name '*.npz' \) | grep -q .; then
            echo "Real/binary weight-like file found in source tree; fail closed."
            exit 1
          fi
          echo "HF8_NO_COMMITTED_WEIGHT_FIXTURE=PASS"
