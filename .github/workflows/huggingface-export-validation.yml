name: huggingface-export-validation

on:
  push:
    branches:
      - galia2/huggingface-migration-v0.1
    paths:
      - tools/build_hf_export.py
      - tools/publish_hf_candidate.py
      - tests/test_hf_export.py
      - tests/test_hf_remote_verify.py
      - huggingface/**
      - docs/HUGGINGFACE_MIGRATION.md
      - requirements-hf.txt
      - .github/workflows/huggingface-export-validation.yml
      - .github/workflows/huggingface-export.yml
      - galia2/**
      - src/**
      - main.py
      - benchmark.py
      - historical_*.py
      - galia_history_bridge.py
      - pyproject.toml
      - requirements.txt
      - LICENSE.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install migration dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade -r requirements-hf.txt

      - name: Unit-test export and remote-verification gates
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v             tests.test_hf_export             tests.test_hf_remote_verify

      - name: Build exact export candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_hf_export.py             --output hf-export             --source-sha "$GITHUB_SHA"

      - name: Assert manifest authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path("hf-export")
          manifest = json.loads(
              (root / "HF_EXPORT_MANIFEST.json").read_text()
          )
          assert manifest["source_sha"] == os.environ["GITHUB_SHA"]
          assert manifest["source_of_truth"] == "github"
          assert manifest["promotion_scope"] == "DISTRIBUTION_MIRROR_ONLY"
          assert manifest["canonical_authority_transferred"] is False
          card = (root / "README.md").read_text()
          assert os.environ["GITHUB_SHA"] in card
          print("HF_EXPORT_VALIDATION=PASS")
          print("HF_EXPORT_FILE_COUNT=" + str(len(manifest["files"])))
          PY

      - name: Upload candidate manifest
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: GALIA_HF_EXPORT_VALIDATION
          path: |
            hf-export/HF_EXPORT_MANIFEST.json
            hf-export/README.md
          if-no-files-found: error
          retention-days: 90
