name: huggingface-export-candidate

on:
  workflow_dispatch:
    inputs:
      hf_repo_id:
        description: "Hugging Face destination in owner-or-org/repo-name form"
        required: true
        type: string
      visibility:
        description: "Destination visibility"
        required: true
        default: private
        type: choice
        options:
          - private
          - public
      create_pr:
        description: "Upload as a Hugging Face pull request"
        required: true
        default: true
        type: boolean
      include_tests:
        description: "Include tests in the distribution mirror"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  export-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: ${{ inputs.hf_repo_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Hugging Face client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade -r requirements-hf.txt

      - name: Build deterministic export
        shell: bash
        run: |
          set -euo pipefail
          args=(--output hf-export --source-sha "$GITHUB_SHA")
          if [ "${{ inputs.include_tests }}" = "true" ]; then
            args+=(--include-tests)
          fi
          python tools/build_hf_export.py "${args[@]}"

      - name: Verify authentication and destination gate
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN repository secret is not configured."
            exit 2
          fi
          if [ -z "${HF_REPO_ID:-}" ] || [[ "$HF_REPO_ID" != */* ]]; then
            echo "::error::hf_repo_id must be owner-or-org/repo-name."
            exit 2
          fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          who = api.whoami()
          assert who and who.get("name")
          print("HF_AUTH_GATE=PASS")
          print("HF_AUTH_USER=" + who["name"])
          PY

      - name: Publish candidate and verify remote snapshot
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repo-id "$HF_REPO_ID"
            --export-dir hf-export
            --visibility "${{ inputs.visibility }}"
            --receipt hf-remote-receipt.json
          )
          if [ "${{ inputs.create_pr }}" = "true" ]; then
            args+=(--create-pr)
          else
            args+=(--no-create-pr)
          fi
          python tools/publish_hf_candidate.py "${args[@]}" | tee hf-upload-result.txt

      - name: Assert remote receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          receipt=json.load(open("hf-remote-receipt.json"))
          assert receipt["repo_id"] == os.environ["HF_REPO_ID"]
          assert receipt["repo_type"] == "model"
          assert receipt["verified_files"] > 0
          assert receipt["source_sha"] == os.environ["GITHUB_SHA"]
          if "${{ inputs.create_pr }}" == "true":
              assert receipt["pr_number"] is not None
              assert receipt["verified_revision"] == f"refs/pr/{receipt['pr_number']}"
          print("HF_REMOTE_RECEIPT_GATE=PASS")
          PY

      - name: Upload migration receipt
        uses: actions/upload-artifact@v4
        with:
          name: GALIA_HUGGINGFACE_REMOTE_RECEIPT
          path: |
            hf-export/HF_EXPORT_MANIFEST.json
            hf-export/README.md
            hf-remote-receipt.json
            hf-upload-result.txt
          if-no-files-found: error
          retention-days: 90
