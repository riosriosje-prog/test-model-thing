name: scan-mcleary-before-1915-11-22

on:
  push:
    branches:
      - galia2/mcleary-1915-source-discovery-v0.1
    paths:
      - .github/workflows/scan-mcleary-before-1915-11-22.yml
      - tools/scan_mcleary_pre_1915_11_22.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PDF text tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Scan 15-20 Nov 1915 issues
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scan
          base="https://ufdcimages.uflib.ufl.edu/AA/00/09/69/97"

          cat > scan/issues.tsv <<'EOF'
          1915-11-15	1438	1915111501.pdf
          1915-11-16	1439	1915111601.pdf
          1915-11-17	1440	1915111701.pdf
          1915-11-18	1441	1915111801.pdf
          1915-11-19	1442	1915111901.pdf
          1915-11-20	1443	1915112001.pdf
          EOF

          : > scan/SUMMARY.jsonl
          while IFS=$'\t' read -r date folder file; do
            f=$(printf "%05d" "$folder")
            url="$base/$f/$file"
            echo "SCAN date=$date folder=$f url=$url"
            code=$(curl --head --location --silent --show-error               --connect-timeout 15 --max-time 30               --user-agent "Mozilla/5.0 GALIA-Historical-Research/0.2"               --output /tmp/headers.txt --write-out "%{http_code}" "$url" || true)
            if [ "$code" != "200" ]; then
              echo "MAPPING_MISS date=$date folder=$f code=$code"
              exit 1
            fi
            curl --fail --location --silent --show-error               --retry 2 --retry-delay 2               --connect-timeout 30 --max-time 300               --user-agent "Mozilla/5.0 GALIA-Historical-Research/0.2"               --output scan/current.pdf "$url"

            PYTHONPATH=. python tools/scan_mcleary_pre_1915_11_22.py               --pdf scan/current.pdf               --date "$date"               --folder "$folder"               --url "$url"               --output scan/current.json

            cat scan/current.json >> scan/SUMMARY.jsonl
            python - <<'PY'
          import json
          d=json.load(open("scan/current.json"))
          print("SCAN_RESULT date=%s hits=%s sha=%s" % (
              d["date"], len(d["hits"]), d["raw_pdf_sha256"]
          ))
          for hit in d["hits"][:4]:
              print("SCAN_HIT " + json.dumps(hit, ensure_ascii=False, sort_keys=True))
          PY
            rm -f scan/current.pdf scan/current.json
          done < scan/issues.tsv

          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open("scan/SUMMARY.jsonl") if x.strip()]
          hits=[r for r in rows if r["hits"]]
          print("PRE_22_SCAN_ISSUES=" + str(len(rows)))
          print("PRE_22_SCAN_HIT_ISSUES=" + str(len(hits)))
          if hits:
              print("EARLIEST_HIT_DATE=" + min(r["date"] for r in hits))
          else:
              print("EARLIEST_HIT_DATE=NONE_IN_WINDOW")
          PY

      - name: Upload scan summary
        uses: actions/upload-artifact@v4
        with:
          name: GALIA_MCLEARY_PRE_1915_11_22_SCAN
          path: |
            scan/issues.tsv
            scan/SUMMARY.jsonl
          if-no-files-found: error
          retention-days: 30
