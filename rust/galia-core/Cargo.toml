[package]
name = "galia-core-shadow"
version = "0.14.0"
edition = "2021"
publish = false
description = "GALIA noncanonical Rust shadow with optional durable signed evidence board"

[lib]
name = "galia_core_shadow"
path = "src/lib.rs"

[[bin]]
name = "galia-shadow"
path = "src/bin/galia-shadow.rs"

[[bin]]
name = "galia-preflight-shadow"
path = "src/bin/galia-preflight-shadow.rs"

[[bin]]
name = "galia-persistence-shadow"
path = "src/bin/galia-persistence-shadow.rs"

[[bin]]
name = "galia-audit-shadow"
path = "src/bin/galia-audit-shadow.rs"

[[bin]]
name = "galia-attestation-shadow"
path = "src/bin/galia-attestation-shadow.rs"

[[bin]]
name = "galia-review-shadow"
path = "src/bin/galia-review-shadow.rs"

[features]
default = []
scratch-store = ["dep:fs2", "dep:tempfile"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
fs2 = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
