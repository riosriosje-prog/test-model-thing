[package]
name = "galia-core-shadow"
version = "0.4.0"
edition = "2021"
publish = false
description = "Rust non-authoritative GALIA 2.0 shadow evaluator and opt-in scratch store"

[lib]
name = "galia_core_shadow"
path = "src/lib.rs"

[[bin]]
name = "galia-shadow"
path = "src/bin/galia-shadow.rs"

[[bin]]
name = "galia-preflight-shadow"
path = "src/bin/galia-preflight-shadow.rs"

[[bin]]
name = "galia-persistence-shadow"
path = "src/bin/galia-persistence-shadow.rs"

[features]
default = []
scratch-store = ["dep:fs2", "dep:tempfile"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
fs2 = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }
