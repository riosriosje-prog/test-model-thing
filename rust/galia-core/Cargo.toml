[package]
name = "galia-core-shadow"
version = "0.3.0"
edition = "2021"
publish = false
description = "Pure, non-authoritative Rust shadow evaluator for GALIA 2.0"

[lib]
name = "galia_core_shadow"
path = "src/lib.rs"

[[bin]]
name = "galia-shadow"
path = "src/bin/galia-shadow.rs"

[[bin]]
name = "galia-preflight-shadow"
path = "src/bin/galia-preflight-shadow.rs"

[[bin]]
name = "galia-persistence-shadow"
path = "src/bin/galia-persistence-shadow.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
